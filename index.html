<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Arc</title>
<meta name="description" content="Winter Arc 2026/27: Habits abhaken, XP sammeln, leveln.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  color-scheme:light dark;
  --bg:#F2F2F7; --bg-a:rgba(242,242,247,.78); --card:#FFFFFF; --card-2:#F2F2F7;
  --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2);
  --label:#000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --pink:#FF2D55; --purple:#AF52DE;
  --indigo:#5856D6; --teal:#30B0C7; --cyan:#32ADE6; --yellow:#FFCC00; --brown:#A2845E; --gray:#8E8E93; --mint:#00C7BE;
  --accent:var(--blue);
  --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.78);
  --glass-border:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.95);
  --glass-shadow:0 12px 32px rgba(20,40,90,.13),0 1px 3px rgba(20,40,90,.08);
  --sheet:rgba(246,246,250,.82); --card-sheet:#FFFFFF; --seg-thumb:#FFFFFF; --sheen:.38;
  --badge-a:rgba(255,255,255,.95); --badge-b:rgba(190,220,255,.6); --badge-c:rgba(110,165,255,.4);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --bg-a:rgba(0,0,0,.7); --card:#1C1C1E; --card-2:#2C2C2E;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
    --label:#FFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --pink:#FF375F; --purple:#BF5AF2;
    --indigo:#5E5CE6; --teal:#40C8E0; --cyan:#64D2FF; --yellow:#FFD60A; --brown:#AC8E68; --gray:#8E8E93; --mint:#63E6E2;
    --glass:rgba(48,48,54,.45); --glass-strong:rgba(48,48,54,.72);
    --glass-border:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.22);
    --glass-shadow:0 12px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
    --sheet:rgba(30,30,32,.84); --card-sheet:#2C2C2E; --seg-thumb:#636366; --sheen:.14;
    --badge-a:rgba(160,200,255,.55); --badge-b:rgba(60,110,220,.45); --badge-c:rgba(30,50,140,.4);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--label);font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif;letter-spacing:-.41px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;min-height:100vh}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.num,.rnd{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Winter-Himmel hinter allem, damit das Glas etwas zum Brechen hat */
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(70% 38% at 8% -4%,rgba(110,165,255,.55),transparent 70%),
   radial-gradient(55% 32% at 100% 2%,rgba(175,150,255,.42),transparent 70%),
   radial-gradient(70% 30% at 55% 16%,rgba(120,220,245,.32),transparent 72%)}
@media (prefers-color-scheme: dark){
  .aurora{background:
   radial-gradient(70% 38% at 8% -4%,rgba(40,90,230,.55),transparent 70%),
   radial-gradient(55% 32% at 100% 2%,rgba(110,60,220,.42),transparent 70%),
   radial-gradient(70% 30% at 55% 16%,rgba(10,120,160,.3),transparent 72%)}
}

/* Liquid Glass */
.glass{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-border),inset 0 1.5px 1px -1px var(--glass-hi)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:var(--sheen);
  background:linear-gradient(155deg,#fff 0%,rgba(255,255,255,0) 36%,rgba(255,255,255,0) 68%,rgba(255,255,255,.5) 100%)}

#app{max-width:600px;margin:0 auto;padding:calc(54px + env(safe-area-inset-top)) 16px calc(118px + env(safe-area-inset-bottom))}
.enter{animation:enter .32s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Navigationsleiste oben */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;pointer-events:none}
.topbar::before{content:"";position:absolute;inset:0 0 -18px;pointer-events:none;opacity:0;transition:opacity .25s;
  background:linear-gradient(var(--bg-a) 55%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.topbar.scrolled::before{opacity:1}
.topbar .ttl{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 26px);transform:translate(-50%,-50%);font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:55%;overflow:hidden;text-overflow:ellipsis}
.topbar.scrolled .ttl{opacity:1}
.topbar .left,.topbar .actions{position:relative;display:flex;gap:10px;pointer-events:auto}
.topbar .actions{margin-left:auto}
.gbtn{width:44px;height:44px;border-radius:22px;border:0;padding:0;display:grid;place-items:center;color:var(--label);transition:transform .25s cubic-bezier(.3,1.6,.5,1),filter .2s}
.gbtn:active,.gpill:active{transform:scale(1.1);filter:brightness(1.08)}
.gbtn.sm{width:36px;height:36px;border-radius:18px}
.gbtn.sm .i{width:18px;height:18px}
.gbtn.tint,.gpill.tint{background:var(--accent);color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent),inset 0 1px 1px rgba(255,255,255,.35)}
.gpill{height:44px;border-radius:22px;border:0;padding:0 16px;display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:500;color:var(--label);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.gpill.sm{height:36px;border-radius:18px;padding:0 14px;font-size:15px}
.gpill .i{width:18px;height:18px}

/* Titel */
.lt{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.37px;margin:2px 0 0}
.lt-sub{color:var(--label-2);font-size:15px;line-height:20px;font-weight:500;letter-spacing:-.24px;margin:2px 0 14px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:28px 4px 10px;gap:12px}
.sh h2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px;margin:0}
.sh .lnk{border:0;background:none;color:var(--accent);font-size:17px;padding:0}
.fl{font-size:13px;color:var(--label-2);margin:20px 16px 7px;letter-spacing:-.08px}
.foot{font-size:13px;color:var(--label-2);margin:8px 16px 0;line-height:18px;letter-spacing:-.08px}
.mt{margin-top:20px}

/* Listen (inset grouped) */
.list,.card{background:var(--card);border-radius:26px;overflow:hidden}
.card{padding:16px}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 16px;position:relative;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;--sl:58px}
.row + .row::before,.row + .add-row::before{content:"";position:absolute;top:0;right:0;left:var(--sl);border-top:.5px solid var(--sep)}
button.row:active,.row-tap:active{background:var(--fill)}
.ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none;background:color-mix(in srgb,var(--c,var(--gray)) 18%,transparent)}
.rc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt{font-size:17px;line-height:22px}
.rs{font-size:13px;line-height:18px;color:var(--label-2);letter-spacing:-.08px}
.rs.red{color:var(--red)}
.rv{color:var(--label-2);font-size:17px}
.chev{width:14px;height:14px;color:var(--label-3);stroke-width:2.6}
.rc-btn{border:0;background:none;text-align:left;padding:0;color:inherit}

/* Häkchen */
.chk{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--label-3);display:grid;place-items:center;flex:none;transition:background .2s,box-shadow .2s}
.chk svg{width:17px;height:17px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4)}
.chk.on{background:var(--c,var(--accent));box-shadow:none}
.chk.on svg{opacity:1;transform:none}
.chk-btn{border:0;background:none;padding:6px;margin:-6px}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}45%{transform:scale(1.18)}100%{transform:scale(1)}}

/* Tab-Leiste */
.tabbar{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:max(12px,calc(env(safe-area-inset-bottom) - 8px));width:min(calc(100% - 28px),460px);height:64px;border-radius:32px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:28px;background:var(--fill);transition:transform .5s cubic-bezier(.3,1.25,.4,1)}
.tab{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--label);border-radius:28px;padding:0}
.tab .i{width:25px;height:25px;stroke-width:1.9}
.tab.on{color:var(--accent)}
.tab.on .i .f{fill:currentColor;fill-opacity:.22}
.bottom-fade{position:fixed;left:0;right:0;bottom:0;height:calc(100px + env(safe-area-inset-bottom));pointer-events:none;z-index:44;background:linear-gradient(transparent,var(--bg-a))}

/* Tagesleiste */
.strip{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px 6px;padding:2px 16px 8px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ds{flex:none;width:46px;border:0;background:none;padding:6px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:center;color:var(--label)}
.ds-wd{font-size:12px;font-weight:600;color:var(--label-2)}
.ds-ring{position:relative;width:36px;height:36px;display:grid;place-items:center}
.ds-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ds-ring b{font-size:15px;font-weight:600;position:relative}
.ds.today .ds-wd{color:var(--accent)}
.ds.sel{background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.ds.sel .ds-wd{color:var(--label)}
.ds.fut{opacity:.35;cursor:default}

/* Charakter-Karte */
.hero{width:100%;border:0;border-radius:28px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;color:var(--label);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.hero:active{transform:scale(.98)}
.badge-orb{border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 32% 26%,var(--badge-a),var(--badge-b) 58%,var(--badge-c));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 -6px 14px rgba(40,90,200,.18),0 8px 22px rgba(30,90,220,.22)}
.hero .badge-orb{width:60px;height:60px;font-size:30px}
.hero-main{flex:1;min-width:0}
.hero-name{font-size:20px;font-weight:700;letter-spacing:.38px;line-height:25px}
.hero-rank{font-size:15px;color:var(--label-2);margin:1px 0 9px;letter-spacing:-.24px}
.hero-xp{display:flex;justify-content:space-between;font-size:12px;color:var(--label-2);margin-top:6px;letter-spacing:0}
.hero-lv{text-align:center;flex:none;align-self:flex-start}
.hero-lv small{display:block;font-size:11px;font-weight:700;color:var(--label-2);letter-spacing:.6px}
.hero-lv b{display:block;font-size:34px;line-height:36px;font-weight:700}
.bar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--blue));animation:grow .9s cubic-bezier(.2,.9,.3,1)}
.bar.green i{background:linear-gradient(90deg,var(--mint),var(--green))}
.bar.orange i{background:linear-gradient(90deg,var(--yellow),var(--orange))}
@keyframes grow{from{transform:translateX(-100%)}}

/* Tagesfortschritt */
.prog{display:flex;align-items:center;gap:18px;margin-top:12px}
.rings{transform:rotate(-90deg);flex:none}
.rings circle{transition:stroke-dashoffset .8s cubic-bezier(.2,.9,.3,1)}
.prog-info{flex:1;min-width:0}
.prog-xp{font-size:15px;color:var(--label-2);margin-bottom:6px}
.prog-xp b{font-size:30px;line-height:34px;color:var(--label);font-weight:700;letter-spacing:0}
.prog-l{display:flex;align-items:center;gap:8px;font-size:15px;line-height:22px;letter-spacing:-.24px}
.prog-l i{width:8px;height:8px;border-radius:50%;flex:none}
.prog-l b{margin-left:auto;font-weight:600}
.perfect{margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--fill);font-size:14px;line-height:19px;letter-spacing:-.15px;color:var(--label-2)}
.perfect.on{background:linear-gradient(120deg,rgba(255,204,0,.28),rgba(255,149,0,.2));color:var(--label);font-weight:600}

/* Stepper */
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:999px;height:34px;flex:none}
.stepper button{width:40px;height:34px;border:0;background:none;display:grid;place-items:center;color:var(--label);border-radius:999px}
.stepper button:active{background:var(--fill-2)}
.stepper button .i{width:16px;height:16px;stroke-width:2.6}
.stepper b{min-width:50px;text-align:center;font-size:15px;font-weight:600}

/* Zeitplan */
.ag{--sl:84px}
.ag-time{width:46px;flex:none;display:flex;flex-direction:column;font-size:15px;line-height:19px}
.ag-time b{font-weight:600}
.ag-time span{color:var(--label-2);font-size:13px}
.ag-bar{width:4px;align-self:stretch;border-radius:2px;flex:none;margin:2px 0}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 18%,transparent);color:var(--c,var(--accent));white-space:nowrap;flex:none;letter-spacing:0}
.xp-tag{font-size:12px;font-weight:700;color:var(--label-2);background:var(--fill);padding:3px 8px;border-radius:999px;flex:none;letter-spacing:0}
.todo.done .rt{color:var(--label-2);text-decoration:line-through}
.empty{padding:22px 16px;text-align:center;color:var(--label-2);font-size:15px;line-height:20px}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.add-row{color:var(--accent);--sl:16px}
.add-row .i{width:20px;height:20px}
.motto{text-align:center;color:var(--label-3);font-size:13px;margin:30px 0 0;letter-spacing:.2px}

/* Prüfungskarte */
.exam{display:flex;gap:14px;align-items:center;width:100%;border:0;text-align:left;color:inherit;padding:16px;border-radius:26px;background:var(--card);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.exam:active{transform:scale(.98)}
.exam + .exam{margin-top:12px}
.exam-e{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;font-size:26px;flex:none;background:color-mix(in srgb,var(--c) 16%,transparent)}
.exam-t{font-size:17px;font-weight:600;line-height:22px}
.exam-m{font-size:13px;color:var(--label-2);margin:2px 0 8px;line-height:18px}
.exam-top{display:flex;align-items:center;gap:8px;justify-content:space-between}

/* Ziele */
.goal{padding:0}
.goal + .goal{margin-top:12px}
.goal-main{display:block;width:100%;border:0;background:none;text-align:left;color:inherit;padding:16px 16px 12px}
.goal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.goal-area{font-size:13px;color:var(--label-2)}
.goal-name{font-size:19px;font-weight:600;line-height:24px;letter-spacing:-.2px}
.goal-why{font-size:15px;color:var(--label-2);font-style:italic;margin-top:4px}
.goal-meta{font-size:13px;color:var(--label-2);margin:8px 0}
.goal.reached{background:linear-gradient(140deg,color-mix(in srgb,var(--green) 16%,var(--card)),var(--card))}
.goal .seg{margin:0 12px 12px}

/* Segment-Steuerung */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:999px;padding:3px;--i:0;--n:2}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:999px;background:var(--seg-thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i) * 100%));transition:transform .4s cubic-bezier(.3,1.25,.4,1)}
.seg button,.seg label{position:relative;z-index:1;border:0;background:none;font-size:14px;font-weight:600;padding:8px 6px;border-radius:999px;text-align:center;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg.lg button{font-size:15px;padding:9px}
.seg-wrap{margin:4px 0 18px}

/* Woche (Plan) */
.plan-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.plan-month{font-size:20px;font-weight:600;letter-spacing:.38px}
.plan-nav{display:flex;gap:8px}
.week{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 6px;touch-action:pan-y}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;color:var(--label)}
.wd span{font-size:12px;font-weight:600;color:var(--label-2)}
.wd b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:600;transition:background .2s}
.wd.today b{color:var(--accent)}
.wd.sel b{background:var(--accent);color:#fff}
.wd.past b{color:var(--label-2)}
.wd.sel.past b{color:#fff}
.wd i{display:flex;gap:3px;height:6px}
.wd i u{width:5px;height:5px;border-radius:50%;background:var(--c)}

/* Profil */
.me-hero{text-align:center;padding:8px 0 4px}
.me-hero .badge-orb{width:116px;height:116px;font-size:58px;margin:0 auto 14px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.me-name{font-size:28px;font-weight:700;letter-spacing:.36px;line-height:34px}
.me-rank{font-size:17px;color:var(--label-2);margin-top:2px}
.me-bar{max-width:340px;margin:16px auto 0}
.me-bar .hero-xp{font-size:13px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.tile{background:var(--card);border-radius:22px;padding:14px 16px}
.tile small{display:block;font-size:13px;color:var(--label-2);letter-spacing:-.08px}
.tile b{display:block;font-size:28px;line-height:34px;font-weight:700;margin-top:4px;letter-spacing:0}
.tile b span{font-size:15px;color:var(--label-2);font-weight:600}
.heat-wrap{padding:16px}
.heat-m{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:3px;font-size:11px;color:var(--label-2);margin-bottom:6px;font-weight:600;letter-spacing:0}
.heat{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(7,auto);gap:3px}
.hc{aspect-ratio:1;border-radius:4px;border:0;padding:0;background:var(--fill)}
.hc.out{visibility:hidden}
.hc.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--fill)}

const TABS = [['today','Heute'],['plan','Plan'],['tasks','Aufgaben'],['learn','Lernen'],['me','Profil']];

/* ---------- Speicher ---------- */
const KEY = 'winterarc.v1';
let S = null;
function freshState(){
  return { v:1, name:'', created:T(), imported:false, seenLevel:1,
    routines:{ morning:ROUTINES.morning.items.map(t => ({id:uid(), t})), evening:ROUTINES.evening.items.map(t => ({id:uid(), t})) },
    days:{}, blocks:[], todos:[], exams:[], goals:[] };
}
function normalize(s){
  const f = freshState();
  s = Object.assign(f, s || {});
  s.days = s.days && typeof s.days === 'object' ? s.days : {};
  for (const k of ['blocks','todos','exams','goals']) s[k] = Array.isArray(s[k]) ? s[k] : [];
  s.exams.forEach(x => { x.topics = Array.isArray(x.topics) ? x.topics : []; });
  if (!s.routines || !s.routines.morning || !s.routines.evening) s.routines = f.routines;
  return s;
}
function load(){ try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : null; } catch { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('⚠️ Speichern fehlgeschlagen'); } }
const dayObj = d => (S.days[d] = S.days[d] || {});

/* ---------- Spielregeln ---------- */
function dayStats(date){
  const d = S.days[date] || {};
  const h = HABITS.filter(x => d.h && d.h[x.id]).length;
  const m = !!d.md, e = !!d.ed;
  const sleep = d.s == null ? null : d.s;
  const sl = sleep != null && sleep >= 7;
  const perfect = h === HABITS.length && m && e;
  const xp = h*10 + (m?10:0) + (e?10:0) + (sl?10:0) + (perfect?25:0);
  return { h, m, e, sl, sleep, perfect, xp };
}
function xpParts(){
  let days = 0;
  for (const k in S.days) days += dayStats(k).xp;
  const todos = S.todos.reduce((a, t) => a + (t.done ? PRIOS[t.prio].xp : 0), 0);
  const learn = S.exams.reduce((a, x) => a + x.topics.reduce((b, t) => b + (t.learned?15:0) + (t.reviewed?10:0), 0), 0);
  const goals = S.goals.filter(g => g.status === 'done').length * 100;
  return { days, todos, learn, goals, total: days + todos + learn + goals };
}
const levelFor = xp => Math.floor(Math.sqrt(xp / 50)) + 1;
const xpForLevel = L => 50 * (L - 1) ** 2;
const rankFor = L => RANKS.slice().reverse().find(r => L >= r.min);
function streak(test){
  const t = arcToday(); if (T() < START) return 0;
  let d = test(t) ? t : addDays(t, -1), n = 0;
  while (d >= START && test(d)) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(test){
  let best = 0, cur = 0;
  if (T() < START) return 0;
  for (let d = START; d <= arcToday(); d = addDays(d, 1)) { if (test(d)) { cur++; if (cur > best) best = cur; } else cur = 0; }
  return best;
}
const habitDone = id => d => !!(S.days[d] && S.days[d].h && S.days[d].h[id]);
const perfectDone = d => dayStats(d).perfect;
function examStatus(x){
  const n = diffDays(T(), x.date), lead = KINDS[x.kind].lead;
  if (n < 0) return x.grade !== '' && x.grade != null ? {t:`Note ${String(x.grade).replace('.', ',')}`, c:'green'} : {t:'Geschrieben', c:'gray'};
  if (n === 0) return {t:'Heute!', c:'red'};
  if (n === 1) return {t:'Morgen', c:'red'};
  if (n <= lead) return {t:'Lernphase', c:'orange'};
  return {t:'Noch Zeit', c:'blue'};
}

/* ---------- Kleine Bausteine ---------- */
const chk = (on, c) => `<span class="chk ${on?'on':''}" style="--c:${C(c)}">${ICON.check}</span>`;
function rings(list, size=104, sw=11, gap=3){
  const c = size/2; let r = c - sw/2, out = '';
  for (const x of list){
    const L = 2*Math.PI*r, p = Math.max(0, Math.min(1, x.p));
    out += `<circle cx="${c}" cy="${c}" r="${r}" stroke="${C(x.c)}" stroke-opacity=".2" stroke-width="${sw}" fill="none"/>`;
    if (p > 0) out += `<circle cx="${c}" cy="${c}" r="${r}" stroke="${C(x.c)}" stroke-width="${sw}" fill="none" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-p)}"/>`;
    r -= sw + gap;
  }
  return `<svg class="rings" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">${out}</svg>`;
}
function miniRing(p, c='blue', size=36, sw=3.2){
  const r = (size - sw)/2, L = 2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill-2)" stroke-width="${sw}"/>${p > 0 ? `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${C(c)}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${L}" stroke-dashoffset="${L*(1-Math.min(1,p))}"/>` : ''}</svg>`;
}
const bar = (p, cls='') => `<div class="bar ${cls}"><i style="width:${Math.max(0, Math.min(1, p))*100}%"></i></div>`;
function seg(action, opts, val, cls=''){

}

const lt = (title, sub) => `<h1 class="lt">${title}</h1>${sub ? `<p class="lt-sub">${sub}</p>` : '<div style="height:14px"></div>'}`;

const ui = { tab:'today', day:null, planDay:null, seg:'todos', showDone:false, examId:null, scroll:{}, pop:null, obBrowser:false };

function vToday(){

function dayStrip(){

      <span class="ds-wd">${WD[dt.getDay()]}</span>
      <span class="ds-ring">${miniRing(fut ? 0 : s.xp / MAX_DAY_XP, s.perfect ? 'yellow' : 'blue')}<b class="rnd">${dt.getDate()}</b></span></button>`;

function heroCard(){

function progressCard(st){

function nextExamCard(){

function segContent(){ return ui.seg === 'todos' ? todosList() : goalsList(); }
function todosList(){
  const t = T(), open = S.todos.filter(x => !x.done).sort(todoSort), done = S.todos.filter(x => x.done).sort((a, b) => (b.doneAt || '').localeCompare(a.doneAt || ''));
  const groups = [
    ['Überfällig', open.filter(x => x.due && x.due < t)],

  </div><div class="list mt">

function streakRow(e, name, c, test){
  const cur = streak(test), best = bestStreak(test);
  return `<div class="row"><span class="ico" style="--c:${C(c)}">${e}</span><span class="rc"><span class="rt">${name}</span><span class="rs">Rekord: ${plural(best, 'Tag', 'Tage')}</span></span>
    <span class="rnd" style="font-size:20px;font-weight:700">${cur ? '🔥 ' : ''}${cur}</span></div>`;
}
function heatmap(){
  const first = addDays(START, -((pd(START).getDay() + 6) % 7));
  const cols = Math.ceil((diffDays(first, END) + 1) / 7), t = T();
  let cells = '', months = '', lastM = -1;
  for (let c = 0; c < cols; c++) {
    const colStart = addDays(first, c * 7);
    for (let r = 0; r < 7; r++) {
      const d = addDays(colStart, r);
      if (d >= START && d <= END && pd(d).getMonth() !== lastM && pd(d).getDate() <= 7) { lastM = pd(d).getMonth(); months += `<span style="grid-column:${c + 1}">${MON[lastM].slice(0, 3)}</span>`; }
      let cls = 'hc', attr = '';
      if (d < START || d > END) cls += ' out';
      else if (d > t) cls += ' fut';
      else { const s = dayStats(d); cls += ' l' + (s.perfect ? 4 : s.xp === 0 ? 0 : s.xp < 35 ? 1 : s.xp < 70 ? 2 : 3); attr = `data-a="heat" data-d="${d}" aria-label="${fmtLong(d)}: ${s.xp} XP"`; if (d === t) cls += ' tdy'; }
      cells += `<button class="${cls}" ${attr} style="grid-column:${c + 1};grid-row:${r + 1}"></button>`;
    }
  }
  return `<div class="card heat-wrap" style="--cols:${cols}"><div class="heat-m">${months}</div><div class="heat">${cells}</div>
    <div class="legend">weniger <span class="hc l0"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span><span class="hc l4"></span> ⭐</div></div>`;
}

/* ---------- Rendern ---------- */
const VIEWS = { today:vToday, plan:vPlan, tasks:vTasks, learn:vLearn, me:vMe };
const TITLES = { today:'Heute', plan:'Plan', tasks:'Aufgaben', learn:'Lernen', me:'Profil' };
const view = $('#view'), topbar = $('#topbar'), tabbar = $('#tabbar'), bfade = $('#bfade');
function render(opts={}){
  if (!S) {
    view.innerHTML = vOnboard();

    return;
  }
  tabbar.style.display = ''; bfade.style.display = '';
  if (!ui.day || ui.day > arcToday() || ui.day < START) ui.day = arcToday();
  if (!ui.planDay) ui.planDay = T();
  const strip = $('#strip'), sl = strip ? strip.scrollLeft : null;
  view.innerHTML = VIEWS[ui.tab]();
  if (opts.enter) { view.classList.remove('enter'); void view.offsetWidth; view.classList.add('enter'); }
  renderTop(); renderTabs();
  const ns = $('#strip');
  if (ns) {
    if (sl != null && !opts.stripToSel) ns.scrollLeft = sl;
    else { const s = ns.querySelector('.sel'); if (s) ns.scrollLeft = s.offsetLeft - ns.clientWidth/2 + s.offsetWidth/2; }
  }

}
function renderTop(){
  let left = '', right = '';
  if (ui.tab === 'today' && ui.day !== arcToday()) right = `<button class="gpill glass" data-a="go-today">Heute</button>`;
  if (ui.tab === 'plan') right = `<button class="gbtn glass" data-a="new-block" aria-label="Zeitblock hinzufügen">${ICON.plus}</button>`;
  if (ui.tab === 'tasks') right = `<button class="gbtn glass" data-a="${ui.seg === 'todos' ? 'new-todo' : 'new-goal'}" aria-label="Hinzufügen">${ICON.plus}</button>`;

  topbar.innerHTML = `<div class="left">${left}</div><div class="ttl">${TITLES[ui.tab]}</div><div class="actions">${right}</div>`;
  topbar.classList.toggle('scrolled', scrollY > 34);
}
function renderTabs(){
  const i = TABS.findIndex(t => t[0] === ui.tab);
  tabbar.innerHTML = `<span class="tab-ind" style="transform:translateX(${i * 100}%)"></span>` + TABS.map(([k, l]) => `<button class="tab ${k === ui.tab ? 'on' : ''}" data-a="tab" data-tab="${k}" aria-label="${l}">${ICON.tabs[k]}<span>${l}</span></button>`).join('');
}
function switchTab(tab){
  if (tab === ui.tab) { scrollTo({top:0, behavior:'smooth'}); return; }
  const old = TABS.findIndex(t => t[0] === ui.tab);
  ui.scroll[ui.tab] = scrollY; ui.tab = tab;
  const ind = $('.tab-ind');
  render({enter:true, stripToSel:true});
  // Glas-Blase gleitet vom alten zum neuen Tab
  const ni = $('.tab-ind'); if (ni && ind) { const i = TABS.findIndex(t => t[0] === tab); ni.style.transition = 'none'; ni.style.transform = `translateX(${old * 100}%)`; void ni.offsetWidth; ni.style.transition = ''; ni.style.transform = `translateX(${i * 100}%)`; }
  scrollTo(0, ui.scroll[tab] || 0);
  topbar.classList.toggle('scrolled', scrollY > 34);
}
addEventListener('scroll', () => topbar.classList.toggle('scrolled', scrollY > 34), {passive:true});

function haptic(){

  if (navigator.vibrate) try { navigator.vibrate(10); } catch {}
}
// Neue Meldungen ersetzen die aktuelle sofort, statt sich hinten anzustellen
let toastEl = null, toastTimer = null;
function toast(msg){
  if (toastEl) { toastEl.textContent = msg; toastEl.classList.remove('bump'); void toastEl.offsetWidth; toastEl.classList.add('bump'); clearTimeout(toastTimer); }
  else {
    const el = toastEl = document.createElement('div'); el.className = 'island'; el.textContent = msg; document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  }
  toastTimer = setTimeout(() => { const el = toastEl; toastEl = null; el.classList.remove('in', 'bump'); el.classList.add('out'); setTimeout(() => el.remove(), 320); }, 1800);
}
function snow(n=28){
  const box = document.createElement('div'); box.className = 'snow';
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.textContent = '❄';
    s.style.left = Math.random()*100 + '%'; s.style.animationDelay = Math.random()*.7 + 's';
    s.style.animationDuration = 1.8 + Math.random()*1.6 + 's'; s.style.fontSize = 10 + Math.random()*18 + 'px';
    s.style.setProperty('--dx', (Math.random()*90 - 45) + 'px'); box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}
function levelUp(L, newRank){
  const r = rankFor(L);
  const el = document.createElement('div'); el.className = 'lvl'; el.dataset.a = 'close-lvl';
  el.innerHTML = `<div class="lvl-card glass"><div class="badge-orb">${r.e}</div><div class="lvl-k">LEVEL UP</div><div class="lvl-n rnd">Level ${L}</div>
    <div class="lvl-r">${newRank ? `Neuer Rang: <b>${r.e} ${r.n}</b>` : `Weiter so, ${esc(S.name || 'Champion')}!`}</div>
    <button class="btn-primary" data-a="close-lvl">Weiter</button></div>`;
  document.body.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  snow(40); haptic();
}

/* Jede Änderung läuft hierüber: speichern, neu zeichnen, XP-Gewinn feiern */
function act(fn, opt={}){
  const before = xpParts().total, pb = dayStats(ui.day || arcToday()).perfect;
  fn(); save();
  const after = xpParts().total, pa = dayStats(ui.day || arcToday()).perfect;
  if (opt.key) ui.pop = opt.key;
  render();
  const g = after - before;
  if (pa && !pb) { toast(`⭐ Perfekter Tag! +${g} XP`); snow(); }
  else if (g >= 100) { toast(`🎯 ${opt.label || 'Ziel erreicht'} · +${g} XP`); snow(); }
  else if (g > 0) toast(`${opt.icon || '✨'} +${g} XP${opt.label ? ' · ' + opt.label : ''}`);
  haptic();
  const L = levelFor(after);
  if (L > (S.seenLevel || 1)) { const oldRank = rankFor(S.seenLevel || 1); S.seenLevel = L; save(); setTimeout(() => levelUp(L, rankFor(L) !== oldRank), 650); }
}

let sheetEl = null, sheetLive = null;
function sheetFrame(title, body, saveAction){
  return `<div class="grab"></div><div class="sh-head"><button class="gbtn sm glass" data-a="close-sheet" aria-label="Schließen">${ICON.x}</button><h3>${title}</h3>${saveAction ? `<button class="gbtn sm tint" data-a="${saveAction}" aria-label="Sichern">${ICON.ok}</button>` : '<span></span>'}</div><div class="sh-body">${body}</div>`;
}
function openSheet(html, {focus=false, live=null}={}){
  if (sheetEl) sheetEl.remove();
  const w = document.createElement('div'); w.className = 'sheet-wrap';
  w.innerHTML = `<div class="backdrop" data-a="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(w); sheetEl = w; sheetLive = live;
  if (focus) { const inp = w.querySelector('.inp'); if (inp) inp.focus({preventScroll:true}); }
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
  enableSheetDrag(w);
}
function closeSheet(){
  const w = sheetEl; if (!w) return;
  sheetEl = null; sheetLive = null;
  if (document.activeElement) document.activeElement.blur();
  w.classList.remove('open'); setTimeout(() => w.remove(), 450);
}
function enableSheetDrag(w){
  const sheet = w.querySelector('.sheet'), head = w.querySelectorAll('.grab, .sh-head');
  let y0 = null, dy = 0, moved = false;
  head.forEach(h => h.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; y0 = e.clientY; dy = 0; moved = false; sheet.classList.add('drag'); h.setPointerCapture(e.pointerId); }));
  head.forEach(h => h.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.max(0, e.clientY - y0); if (dy > 4) moved = true; sheet.style.transform = `translateY(${dy}px)`; }));
  const end = () => { if (y0 == null) return; y0 = null; sheet.classList.remove('drag'); sheet.style.transform = ''; if (moved && dy > 110) closeSheet(); };
  head.forEach(h => { h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end); });
}

async function decryptSeed(pw){
  const raw = Uint8Array.from(atob(SEED), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:raw.slice(0, 16), iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(16, 28)}, key, raw.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}
function applySeed(seed){
  if (!S.name && seed.name) S.name = seed.name;
  for (const [name, type, start, end, dates] of seed.rec) for (const date of dates) S.blocks.push({id:uid(), name, type, date, start, end, note:'', cal:true});
  for (const [name, type, date, start, end] of seed.one) S.blocks.push({id:uid(), name, type, date, start, end, note:'', cal:true});
  for (const [name, kind, date] of seed.exams) S.exams.push({id:uid(), name, kind, date, grade:'', topics:[]});
  for (const [name, area, type, status, deadline] of seed.goals) S.goals.push({id:uid(), name, area, type, status, deadline, why:''});
  S.imported = true;
}

/* ---------- Backup ---------- */
async function exportData(){
  const name = `winter-arc-backup-${T()}.json`;
  const file = new File([JSON.stringify(S, null, 1)], name, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:'Winter Arc Backup'}); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('💾 Backup gespeichert');
}

  openSheet(sheetFrame('📂 Backup laden', `<form id="f" onsubmit="return false">
    <p class="foot" style="margin:0 4px 14px;font-size:15px;line-height:21px;color:var(--label)">Wähle eine Backup-Datei aus „Dateien“. ${S ? 'Achtung: Deine aktuellen Daten werden ersetzt.' : ''}</p>
    <label class="btn-primary" style="cursor:pointer">Datei auswählen<input type="file" accept="application/json,.json" id="fileIn" class="hide"></label>
    <div class="fl">Oder Backup-Text einfügen</div><div class="list"><div class="row"><textarea class="inp" name="code" rows="4" placeholder="{ … }" style="min-height:80px;font-size:13px"></textarea></div></div>
    <button type="button" class="btn-plain" data-a="import-text">Text laden</button></form>`, null));
  $('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(f); });
}
function restore(text){
  let data; try { data = JSON.parse(text); } catch { toast('⚠️ Das ist kein gültiges Backup'); return; }
  if (!data || typeof data !== 'object' || !data.days || !Array.isArray(data.todos)) { toast('⚠️ Das ist kein Winter-Arc-Backup'); return; }
  if (S && !confirm('Aktuelle Daten durch das Backup ersetzen?')) return;
  S = normalize(data); S.seenLevel = Math.max(S.seenLevel || 1, levelFor(xpParts().total)); save();
  closeSheet(); ui.day = null; render({enter:true}); toast('✅ Backup geladen');
}

}
function closePush(){
  const el = push; if (!el) return;
  push = null; ui.examId = null;
  el.classList.remove('open'); setTimeout(() => el.remove(), 460);
  render();
}
function enablePushSwipe(el){
  let x0 = null, dx = 0;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; if (t.clientX < 28) { x0 = t.clientX; dx = 0; el.classList.add('drag'); } }, {passive:true});
  el.addEventListener('touchmove', e => { if (x0 == null) return; dx = Math.max(0, e.touches[0].clientX - x0); el.style.transform = `translateX(${dx}px)`; }, {passive:true});
  el.addEventListener('touchend', () => { if (x0 == null) return; x0 = null; el.classList.remove('drag'); el.style.transform = ''; if (dx > 110) closePush(); });
}
function enableWeekSwipe(){
  let x0 = null, y0 = null;
  document.addEventListener('touchstart', e => { const w = e.target.closest('#week'); if (!w) return; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  document.addEventListener('touchend', e => {
    if (x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) { ui.planDay = addDays(ui.planDay, dx < 0 ? 7 : -7); render(); haptic(); }
  }, {passive:true});
}

/* ---------- Aktionen ---------- */
const findExam = () => S.exams.find(e => e.id === ui.examId);
const A = {
  tab: el => { if (el.dataset.d) ui.planDay = el.dataset.d; switchTab(el.dataset.tab); },
  'pick-day': el => { ui.day = el.dataset.d; render(); haptic(); },
  'go-today': () => { ui.day = arcToday(); render({stripToSel:true}); },
  heat: el => { ui.day = el.dataset.d; ui.scroll.today = 0; switchTab('today'); render({stripToSel:true}); },
  habit: el => {
    const id = el.dataset.h, hb = HABITS.find(x => x.id === id);
    act(() => { const d = dayObj(ui.day); d.h = d.h || {}; if (d.h[id]) delete d.h[id]; else d.h[id] = 1; }, {key:el.dataset.k, icon:hb.e, label:hb.name});
  },
  routine: el => openRoutine(el.dataset.r),
  'rt-item': el => {
    const k = el.dataset.r, r = ROUTINES[k], id = el.dataset.id;
    act(() => {
      const d = dayObj(ui.day); const map = d[r.key] = d[r.key] || {};
      if (map[id]) delete map[id]; else map[id] = 1;
      const items = S.routines[k]; d[r.done] = items.length > 0 && items.every(it => map[it.id]);
      if (!d[r.done]) delete d[r.done];
    }, {key:`ri-${id}`, icon:r.e, label:`${r.name} komplett`});
  },
  sleep: el => act(() => { const d = dayObj(ui.day), dv = +el.dataset.v; d.s = d.s == null ? (dv > 0 ? 7 : 6.5) : Math.max(0, Math.min(14, d.s + dv)); }, {icon:'😴', label:'Ausgeschlafen'}),
  note: () => openNote(),
  'save-note': () => { const v = fv('note').trim(); act(() => { const d = dayObj(ui.day); if (v) d.n = v; else delete d.n; }); closeSheet(); },
  todo: el => act(() => { const t = S.todos.find(x => x.id === el.dataset.id); t.done = !t.done; t.doneAt = t.done ? T() : null; }, {key:`t-${el.dataset.id}`, icon:'✅', label:'To-do erledigt'}),
  'new-todo': el => openTodo(null, el && el.dataset.d ? {due:el.dataset.d} : {}),
  'edit-todo': el => openTodo(el.dataset.id),
  'save-todo': saveTodo,
  'del-todo': el => { if (!confirm('To-do löschen?')) return; act(() => { S.todos = S.todos.filter(x => x.id !== el.dataset.id); }); closeSheet(); },
  'toggle-done': () => { ui.showDone = !ui.showDone; render(); },
  seg: el => { ui.seg = el.dataset.v; const s = el.closest('.seg'); s.style.setProperty('--i', [...s.querySelectorAll('button')].indexOf(el)); $('#segc').innerHTML = segContent(); renderTop(); haptic(); },
  'new-goal': () => openGoal(),
  'edit-goal': el => openGoal(el.dataset.id),
  'save-goal': saveGoal,
  'del-goal': el => { if (!confirm('Ziel löschen?')) return; act(() => { S.goals = S.goals.filter(x => x.id !== el.dataset.id); S.todos.forEach(t => { if (t.goalId === el.dataset.id) t.goalId = ''; }); }); closeSheet(); },
  'goal-status': el => act(() => { S.goals.find(x => x.id === el.dataset.id).status = el.dataset.v; }, {label:'Ziel erreicht'}),
  'new-block': el => openBlock(null, el && el.dataset.d ? el.dataset.d : (ui.tab === 'plan' ? ui.planDay : ui.day)),
  'edit-block': el => openBlock(el.dataset.id),
  'save-block': saveBlock,
  'del-block': el => { if (!confirm('Zeitblock löschen?')) return; act(() => { S.blocks = S.blocks.filter(x => x.id !== el.dataset.id); }); closeSheet(); },
  week: el => { ui.planDay = addDays(ui.planDay, 7 * +el.dataset.v); render(); haptic(); },
  'plan-day': el => { ui.planDay = el.dataset.d; render(); haptic(); },
  'plan-today': () => { ui.planDay = T(); render(); },
  'new-exam': () => openExam(),
  'edit-exam': () => openExam(ui.examId),
  'save-exam': saveExam,
  'del-exam': el => { if (!confirm('Prüfung samt Themen löschen?')) return; act(() => { S.exams = S.exams.filter(x => x.id !== el.dataset.id); }); closeSheet(); if (push) closePush(); },
  'open-exam': el => openPush(el.dataset.id),
  'close-push': () => closePush(),
  topic: el => {
    const f = el.dataset.f, id = el.dataset.id;
    act(() => { const tp = findExam().topics.find(t => t.id === id); tp[f] = !tp[f]; }, {key:`tp-${id}`, icon:f === 'learned' ? '📚' : '🔁', label:f === 'learned' ? 'Thema gelernt' : 'Thema wiederholt'});
  },
  'add-topic': () => {
    const inp = $('#newTopic'), name = inp ? inp.value.trim() : '';
    if (!name) { if (inp) inp.focus(); return; }
    inp.value = '';
    act(() => { findExam().topics.push({id:uid(), name, learned:false, reviewed:false, on:null}); });
    const ni = $('#newTopic'); if (ni) ni.focus({preventScroll:true});
  },
  'edit-topic': el => openTopic(el.dataset.id),
  'save-topic': () => {
    const name = fv('title').trim(); if (!name) { toast('Gib dem Thema einen Namen'); return; }
    const id = $('#f').dataset.id, on = fc('has_on') ? fv('on') : null;
    act(() => { const tp = findExam().topics.find(t => t.id === id); tp.name = name; tp.on = on; }); closeSheet();
  },
  'del-topic': el => { act(() => { const x = findExam(); x.topics = x.topics.filter(t => t.id !== el.dataset.id); }); closeSheet(); },
  'edit-name': () => openName(),
  'save-name': () => { const v = fv('title').trim(); act(() => { S.name = v; }); closeSheet(); },
  'edit-routines': () => openRoutineEditor(),
  'rt-add': el => { const tmp = document.createElement('div'); tmp.innerHTML = rtEditRow('new-' + uid(), ''); const row = tmp.firstElementChild; el.before(row); row.querySelector('.inp').focus(); },
  'rt-del': el => el.closest('.row').remove(),
  'save-routines': () => {
    const next = {};
    for (const k of ['morning', 'evening']) next[k] = [...document.querySelectorAll(`[data-rt="${k}"] .row[data-id]`)].map(r => ({ id: r.dataset.id.startsWith('new-') ? uid() : r.dataset.id, t: r.querySelector('.inp').value.trim() })).filter(it => it.t);
    act(() => { S.routines = next; }); closeSheet(); toast('✅ Routinen gespeichert');
  },
  rules: () => openRules(),
  notion: () => {
    if (S && S.imported && !confirm('Die Notion-Daten wurden schon übernommen. Nochmal laden? Das erzeugt doppelte Einträge.')) return;
    openNotion();
  },
  'notion-go': async el => {
    const pw = fv('pw'); if (!pw.trim()) return;
    el.textContent = 'Entschlüssle …'; el.disabled = true;
    try {
      const seed = await decryptSeed(pw);
      const first = !S;
      if (first) S = freshState();
      applySeed(seed); save(); closeSheet(); ui.day = null; render({enter:true});
      toast(first ? `❄️ Willkommen, ${S.name || 'Champion'}!` : '✅ Notion-Daten übernommen'); snow(); haptic();
    } catch { el.textContent = 'Daten laden'; el.disabled = false; toast('🔒 Falsches Passwort'); }
  },
  'ob-fresh': () => { S = freshState(); save(); render({enter:true}); toast('❄️ Los geht’s!'); },
  'ob-browser': () => { ui.obBrowser = true; render(); },
  export: () => exportData(),
  import: () => openImport(),
  'import-text': () => restore(fv('code')),
  reset: () => {
    if (!confirm('Wirklich alles löschen? Habits, XP, Termine und To-dos sind dann weg.')) return;
    if (!confirm('Letzte Warnung: Hast du ein Backup? Alles wird gelöscht.')) return;
    localStorage.removeItem(KEY); S = null; ui.day = null; ui.tab = 'today'; render();
  },
  'close-sheet': () => closeSheet(),
  'close-lvl': (el, e) => { const l = e.target.closest('.lvl'); if (!l) return; l.classList.remove('in'); setTimeout(() => l.remove(), 350); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.a === 'close-lvl' || el.classList.contains('backdrop')) e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !sheetEl || e.target.tagName === 'TEXTAREA') return;
  const ok = sheetEl.querySelector('.sh-head .tint'); if (ok && e.target.classList.contains('inp')) { e.preventDefault(); ok.click(); }
  else if (e.target.name === 'pw') { e.preventDefault(); const b = sheetEl.querySelector('[data-a="notion-go"]'); if (b) b.click(); }
});

/* Tastatur: Sheets bleiben über der Tastatur */
if (window.visualViewport) {
  const vv = () => { document.documentElement.style.setProperty('--vvh', visualViewport.height + 'px'); document.documentElement.style.setProperty('--vvt', visualViewport.offsetTop + 'px'); };
  visualViewport.addEventListener('resize', vv); visualViewport.addEventListener('scroll', vv); vv();
}
/* Um Mitternacht oder beim Zurückkehren in die App auf den neuen Tag springen */
let lastSeen = T();
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && T() !== lastSeen) { lastSeen = T(); ui.day = arcToday(); render({stripToSel:true}); } });

S = load();
enableWeekSwipe();
render({stripToSel:true});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
