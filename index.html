<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Winter Arc</title>
<meta name="description" content="Winter Arc 2026/27: Habits abhaken, XP sammeln, leveln.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Winter Arc">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Systemfarben und Materialien nach den iOS-Richtlinien (hell, dunkel, erhöhter Kontrast) */
:root{
  color-scheme:light dark;
  --bg:#F2F2F7; --bg-a:rgba(242,242,247,.7); --card:#FFFFFF; --card-sheet:#FFFFFF;
  --fill:rgba(120,120,128,.12); --fill-2:rgba(120,120,128,.2); --fill-3:rgba(118,118,128,.08);
  --label:#000; --label-2:rgba(60,60,67,.6); --label-3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.24);
  --blue:#007AFF; --green:#34C759; --orange:#FF9500; --red:#FF3B30; --pink:#FF2D55; --purple:#AF52DE;
  --indigo:#5856D6; --teal:#30B0C7; --cyan:#32ADE6; --yellow:#FFCC00; --brown:#A2845E; --gray:#8E8E93; --mint:#00C7BE;
  --accent:var(--blue);
  --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.82);
  --glass-rim:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.95);
  --glass-shadow:0 8px 28px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);
  --sheet:rgba(242,242,247,.86); --seg-thumb:#FFFFFF; --sheen:.35;
  --orb-a:rgba(255,255,255,.95); --orb-b:rgba(190,220,255,.65); --orb-c:rgba(110,165,255,.45);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --bg-a:rgba(0,0,0,.66); --card:#1C1C1E; --card-sheet:#2C2C2E;
    --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36); --fill-3:rgba(118,118,128,.16);
    --label:#FFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
    --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --pink:#FF375F; --purple:#BF5AF2;
    --indigo:#5E5CE6; --teal:#40C8E0; --cyan:#64D2FF; --yellow:#FFD60A; --brown:#AC8E68; --gray:#8E8E93; --mint:#63E6E2;
    --glass:rgba(44,44,48,.5); --glass-strong:rgba(44,44,48,.78);
    --glass-rim:rgba(255,255,255,.14); --glass-hi:rgba(255,255,255,.22);
    --glass-shadow:0 8px 28px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.4);
    --sheet:rgba(28,28,30,.86); --seg-thumb:#636366; --sheen:.12;
    --orb-a:rgba(160,200,255,.55); --orb-b:rgba(60,110,220,.45); --orb-c:rgba(30,50,140,.4);
  }
}
@media (prefers-contrast: more){
  :root{--sep:rgba(60,60,67,.55); --label-2:rgba(60,60,67,.85); --glass:rgba(255,255,255,.9)}
  @media (prefers-color-scheme: dark){:root{--sep:rgba(120,120,128,.8); --label-2:rgba(235,235,245,.85); --glass:rgba(44,44,48,.92)}}
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Dynamic Type: 1rem folgt der Textgröße aus den iOS-Einstellungen */
html{font-size:17px;font:-apple-system-body;background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,sans-serif;font-size:1rem;line-height:1.29;letter-spacing:-.024em;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;min-height:100vh}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;letter-spacing:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
.rnd{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.hide{display:none!important}
.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gl{width:19px;height:19px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

/* Leichter Winter-Verlauf oben im Inhalt; scrollt mit, damit die Glas-Leisten etwas zum Brechen haben */
.aurora{position:absolute;left:0;right:0;top:0;height:440px;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 55% at 6% 0%,rgba(110,165,255,.42),transparent 70%),radial-gradient(55% 45% at 100% 0%,rgba(175,150,255,.32),transparent 70%),radial-gradient(70% 40% at 55% 22%,rgba(120,220,245,.22),transparent 72%);
  -webkit-mask-image:linear-gradient(#000 40%,transparent);mask-image:linear-gradient(#000 40%,transparent)}
@media (prefers-color-scheme: dark){
  .aurora{height:360px;background:radial-gradient(80% 60% at 10% 0%,rgba(40,90,230,.26),transparent 72%),radial-gradient(60% 50% at 100% 0%,rgba(110,60,220,.18),transparent 72%)}
}
/* Die App reicht bis unter die Statusleiste. Deren Schrift ist dabei immer weiß,
   deshalb liegt im hellen Modus ein feiner Schatten dahinter, damit Uhrzeit und Akku lesbar bleiben. */
.sb-scrim{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 10px);z-index:41;pointer-events:none;display:none}
@media (prefers-color-scheme: light){ .standalone .sb-scrim{display:block;background:linear-gradient(rgba(0,0,0,.34),rgba(0,0,0,.12) 70%,transparent)} }

/* Auswahl von Symbol und Farbe für eigene Habits */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:10px;padding:14px}
.pick-colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:12px;padding:14px}
.pg,.pc{display:grid;place-items:center;cursor:pointer;position:relative}
.pg input,.pc input{position:absolute;opacity:0;pointer-events:none}
.pg .ico{width:42px;height:42px;border-radius:11px;background:var(--fill);transition:background .2s}
.pg .ico .gl{stroke:var(--label);width:21px;height:21px}
.pg input:checked + .ico{background:var(--c-sel,var(--blue))}
.pg input:checked + .ico .gl{stroke:#fff}
.pc span{width:30px;height:30px;border-radius:50%;transition:box-shadow .2s}
.pc input:checked + span{box-shadow:0 0 0 2.5px var(--card-sheet),0 0 0 4.5px var(--label-2)}

/* Liquid Glass – nur für Bedienelemente: Tab-Leiste, Symbolleisten-Buttons, Sheets, Meldungen */
.glass{position:relative;isolation:isolate;background:var(--glass);
  -webkit-backdrop-filter:blur(20px) saturate(190%);backdrop-filter:blur(20px) saturate(190%);
  box-shadow:var(--glass-shadow),inset 0 0 0 .5px var(--glass-rim),inset 0 1.5px 1px -1px var(--glass-hi)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;opacity:var(--sheen);
  background:linear-gradient(155deg,#fff 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 70%,rgba(255,255,255,.55) 100%)}
@media (prefers-reduced-transparency: reduce){ .glass{background:var(--glass-strong);-webkit-backdrop-filter:none;backdrop-filter:none} }

#app{position:relative;max-width:640px;margin:0 auto;padding:calc(52px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.enter{animation:enter .3s cubic-bezier(.2,.9,.3,1)}
@keyframes enter{from{opacity:.5}to{opacity:1}}

/* Navigationsleiste mit Scroll-Kanten-Effekt */
.topbar{position:fixed;top:0;left:0;right:0;z-index:40;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;pointer-events:none}
.topbar::before,.push-bar::before{content:"";position:absolute;inset:0 0 -22px;pointer-events:none;opacity:0;transition:opacity .2s;
  background:linear-gradient(var(--bg-a) 50%,transparent);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  -webkit-mask-image:linear-gradient(#000 50%,transparent);mask-image:linear-gradient(#000 50%,transparent)}
.topbar.scrolled::before,.push-bar.scrolled::before{opacity:1}
.ttl{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 26px);transform:translate(-50%,-50%);font-size:17px;font-weight:600;letter-spacing:-.43px;opacity:0;transition:opacity .18s;white-space:nowrap;max-width:52%;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.scrolled .ttl{opacity:1}
.bar-l,.bar-r{position:relative;display:flex;gap:8px;pointer-events:auto}
.bar-r{margin-left:auto}
.gbtn{width:44px;height:44px;border-radius:22px;border:0;padding:0;display:grid;place-items:center;color:var(--label);transition:transform .3s cubic-bezier(.3,1.6,.5,1),filter .2s}
.gbtn:active,.gpill:active{transform:scale(1.12);filter:brightness(1.1)}
.gbtn .i{width:21px;height:21px}
.gbtn.sm{width:34px;height:34px;border-radius:17px}
.gbtn.sm .i{width:17px;height:17px}
.gbtn.tint,.gpill.tint{background:var(--accent);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 32%,transparent),inset 0 1px 1px rgba(255,255,255,.35)}
.gpill{height:44px;border-radius:22px;border:0;padding:0 16px;display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:500;letter-spacing:-.43px;color:var(--label);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}

/* Titel und Abschnitte (Textstile: Large Title, Title 2, Subheadline, Footnote) */
.lt{font-size:2rem;line-height:1.206;font-weight:700;letter-spacing:.011em;margin:2px 0 0}
.lt-sub{color:var(--label-2);font-size:.882rem;line-height:1.33;letter-spacing:-.016em;margin:2px 0 16px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:30px 4px 10px;gap:12px}
.sh h2{font-size:1.294rem;line-height:1.27;font-weight:700;letter-spacing:-.012em;margin:0}
.lnk{border:0;background:none;color:var(--accent);font-size:1rem;padding:6px 0;margin:-6px 0}
.lnk:active{opacity:.4}
.fl{font-size:.765rem;line-height:1.385;color:var(--label-2);margin:22px 16px 7px;letter-spacing:-.006em}
.fl.first{margin-top:4px}
.foot{font-size:.765rem;line-height:1.385;color:var(--label-2);margin:8px 16px 0;letter-spacing:-.006em}
.mt{margin-top:20px}

/* Listen im iOS-Stil (inset grouped) */
.list,.card{background:var(--card);border-radius:26px;overflow:hidden}
.card{padding:16px}
.li{position:relative}
.li + .li::before{content:"";position:absolute;top:0;right:0;left:var(--sl,62px);border-top:.5px solid var(--sep);z-index:3;pointer-events:none}
.row{display:flex;align-items:center;gap:14px;min-height:52px;padding:10px 16px;width:100%;text-align:left;border:0;background:var(--card);color:inherit;font:inherit;position:relative}
button.row:active,.row-press:active{background:color-mix(in srgb,var(--label) 9%,var(--card))}
.sh-body .row{background:var(--card-sheet)}
.ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--c,var(--gray))}
.ico.em{background:var(--fill);font-size:17px}
.rc{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.rt{font-size:1rem;line-height:1.29}
.rs{font-size:.882rem;line-height:1.33;color:var(--label-2);letter-spacing:-.016em}
.rs.red{color:var(--red)}
.rv{color:var(--label-2);font-size:1rem;white-space:nowrap}
.chev{width:13px;height:13px;color:var(--label-3);stroke-width:2.8}
.rc-btn{border:0;background:none;text-align:left;padding:0;color:inherit;font:inherit}
.flame{width:12px;height:12px;fill:var(--orange);stroke:none;vertical-align:-1px;margin-right:2px}
.prio{color:var(--c);font-weight:700;margin-right:4px}

/* Abhak-Kreise wie in Erinnerungen */
.chk{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.6px var(--label-3);display:grid;place-items:center;flex:none;transition:background .2s,box-shadow .2s}
.chk svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4)}
.chk.on{background:var(--c,var(--accent));box-shadow:none}
.chk.on svg{opacity:1;transform:none}
.chk-btn{border:0;background:none;padding:9px;margin:-9px;display:grid}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}45%{transform:scale(1.15)}100%{transform:scale(1)}}

/* Wischaktionen in Listenzeilen */
.sw{overflow:hidden;touch-action:pan-y}
.sw-c{position:relative;z-index:1;transition:transform .38s cubic-bezier(.2,.9,.3,1)}
.sw.moving .sw-c{transition:none}
.sw-bg{position:absolute;inset:0;display:flex;align-items:stretch;opacity:0}
.sw-bg.r{justify-content:flex-end;background:var(--red)}
.sw-bg.l{justify-content:flex-start;background:var(--green)}
.sw.dir-r .sw-bg.r,.sw.dir-l .sw-bg.l{opacity:1}
.sw-bg button,.sw-bg span{border:0;background:none;color:#fff;font-size:.882rem;font-weight:600;min-width:88px;display:flex;align-items:center;justify-content:center;padding:0 16px}

/* Tab-Leiste */
.tabbar{position:fixed;z-index:45;left:50%;transform:translateX(-50%);bottom:max(12px,calc(env(safe-area-inset-bottom) - 8px));width:min(calc(100% - 32px),440px);height:62px;border-radius:31px;display:grid;grid-template-columns:repeat(5,1fr);padding:4px}
.tab-ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/5);border-radius:27px;background:var(--fill);transition:transform .5s cubic-bezier(.3,1.25,.4,1)}
.tab{position:relative;z-index:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;letter-spacing:.1px;color:var(--label);border-radius:27px;padding:0}
.tab svg{width:24px;height:24px;fill:currentColor;stroke:currentColor;stroke-width:0;stroke-linecap:round}
.tab svg .s{fill:none;stroke-width:1.9}
.tab.on{color:var(--accent)}
.bottom-fade{position:fixed;left:0;right:0;bottom:0;height:calc(96px + env(safe-area-inset-bottom));pointer-events:none;z-index:44;background:linear-gradient(transparent,var(--bg-a));-webkit-mask-image:linear-gradient(transparent,#000 60%);mask-image:linear-gradient(transparent,#000 60%)}

/* Tagesleiste wie im Kalender */
.strip{display:flex;gap:2px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -16px 8px;padding:2px 12px 6px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ds{flex:none;width:46px;border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:center;color:var(--label)}
.ds-wd{font-size:11px;font-weight:600;color:var(--label-2);letter-spacing:.06px}
.ds b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:500;transition:background .2s}
.ds.today b{color:var(--accent);font-weight:600}
.ds.sel b{background:var(--label);color:var(--bg);font-weight:600}
.ds.sel.today b{background:var(--accent);color:#fff}
.ds i{display:block;width:18px;height:3px;border-radius:2px;background:var(--fill-2);overflow:hidden}
.ds i u{display:block;height:100%;background:var(--accent)}
.ds i.star{background:none;width:auto;height:auto;font-style:normal;font-size:9px;line-height:3px;color:var(--yellow)}
.ds.fut{opacity:.35;cursor:default}

/* Übersichtskarte (Inhaltsebene, kein Glas) */
.orb{border-radius:50%;display:grid;place-items:center;flex:none;
  background:radial-gradient(circle at 32% 26%,var(--orb-a),var(--orb-b) 58%,var(--orb-c));
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.6),inset 0 -6px 14px rgba(40,90,200,.16)}
.summary{display:flex;align-items:center;gap:14px;width:100%;border:0;text-align:left;color:inherit;padding:16px;border-radius:26px;background:var(--card);transition:transform .25s cubic-bezier(.3,1.5,.5,1)}
.summary:active{transform:scale(.98)}
.summary .orb{width:54px;height:54px;font-size:28px}
.sum-name{display:block;font-size:1rem;font-weight:600;letter-spacing:-.024em}
.sum-rank{display:block;font-size:.882rem;color:var(--label-2);margin:1px 0 8px;letter-spacing:-.016em}
.sum-xp{display:flex;justify-content:space-between;gap:8px;font-size:.706rem;color:var(--label-2);margin-top:6px;letter-spacing:0}
.pbar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px;background:var(--c,var(--accent));transform-origin:left;animation:grow .8s cubic-bezier(.2,.9,.3,1)}
@keyframes grow{from{transform:scaleX(0)}}

/* Tagesfortschritt: Messanzeige statt Ringen */
.prog{display:flex;align-items:center;gap:18px}
.gauge-wrap{position:relative;width:108px;height:108px;flex:none}
.gauge-wrap svg{position:absolute;inset:0}
.gauge-wrap circle{transition:stroke-dasharray .7s cubic-bezier(.2,.9,.3,1)}
.gauge-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:4px}
.gauge-c b{font-size:1.647rem;line-height:1.1;font-weight:700;letter-spacing:0}
.gauge-c span{font-size:.706rem;color:var(--label-2);letter-spacing:0}
.metrics{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.metric-h{display:flex;justify-content:space-between;align-items:baseline;font-size:.882rem;letter-spacing:-.016em;margin-bottom:4px}
.metric-h b{font-weight:600}
.card-row{display:flex;align-items:center;gap:12px;margin:14px -16px -16px;padding:12px 16px;border-top:.5px solid var(--sep)}

/* Stepper wie UIStepper */
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:32px;flex:none}
.stepper button{width:46px;height:32px;border:0;background:none;display:grid;place-items:center;color:var(--label);border-radius:9px}
.stepper button:active{background:var(--fill-2)}
.stepper button .i{width:15px;height:15px;stroke-width:2.6}
.stepper i{width:1px;height:18px;background:var(--sep)}

/* Zeitplan */
.ag{--sl:84px}
.ag-time{width:46px;flex:none;display:flex;flex-direction:column;font-size:.882rem;line-height:1.3;letter-spacing:-.016em}
.ag-time b{font-weight:600}
.ag-time span{color:var(--label-2)}
.ag-bar{width:4px;align-self:stretch;border-radius:2px;flex:none;margin:2px 0}
.pill{font-size:.706rem;font-weight:600;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent));white-space:nowrap;flex:none;letter-spacing:0}
.xp-tag{font-size:.706rem;font-weight:600;color:var(--label-2);flex:none;letter-spacing:0}
.todo.done .rt{color:var(--label-2)}
.empty{padding:18px 16px;text-align:center;color:var(--label-2);font-size:.882rem;line-height:1.33}
.empty-big{padding:34px 20px;text-align:center}
.empty-big .ico{width:56px;height:56px;border-radius:15px;margin:0 auto 12px}
.empty-big .ico .gl{width:30px;height:30px}
.empty-big b{display:block;font-size:1.176rem;font-weight:600;margin-bottom:4px}
.empty-big span{color:var(--label-2);font-size:.882rem}
.add-row{color:var(--accent);--sl:16px}
.add-row .i{width:21px;height:21px}
.motto{text-align:center;color:var(--label-3);font-size:.765rem;margin:30px 0 0}

/* Ziele */
.goal{padding:0}
.goal + .goal{margin-top:12px}
.goal-main{display:block;width:100%;border:0;background:none;text-align:left;color:inherit;padding:16px 16px 12px;font:inherit}
.goal-main:active{background:color-mix(in srgb,var(--label) 6%,var(--card))}
.goal-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:.765rem;color:var(--label-2)}
.goal-name{font-size:1.176rem;font-weight:600;line-height:1.25;letter-spacing:-.023em}
.goal-why{font-size:.882rem;color:var(--label-2);margin-top:4px}
.goal-meta{font-size:.765rem;color:var(--label-2);margin:8px 0}
.goal .seg{margin:0 12px 12px}

/* Segment-Steuerung (nur Text, wie iOS) */
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:999px;padding:2px;--i:0;--n:2}
.seg .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n));border-radius:999px;background:var(--seg-thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);transform:translateX(calc(var(--i) * 100%));transition:transform .4s cubic-bezier(.3,1.25,.4,1)}
.seg button,.seg label{position:relative;z-index:1;border:0;background:none;font-size:13px;font-weight:600;padding:7px 6px;border-radius:999px;text-align:center;letter-spacing:-.08px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--label)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg-wrap{margin:0 0 18px}

/* Woche (Plan) */
.plan-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.plan-month{font-size:1.176rem;font-weight:600;letter-spacing:-.023em}
.plan-nav{display:flex;align-items:center;gap:2px}
.plan-nav button{border:0;background:none;color:var(--accent);font-size:1rem;padding:8px 10px;display:grid;place-items:center}
.plan-nav button:active{opacity:.4}
.plan-nav .i{width:20px;height:20px;stroke-width:2.4}
.week{display:grid;grid-template-columns:repeat(7,1fr);padding:8px 6px 10px;touch-action:pan-y}
.wd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 0;color:var(--label)}
.wd span{font-size:11px;font-weight:600;color:var(--label-2)}
.wd b{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:500;transition:background .2s}
.wd.today b{color:var(--accent);font-weight:600}
.wd.sel b{background:var(--label);color:var(--bg);font-weight:600}
.wd.sel.today b{background:var(--accent);color:#fff}
.wd i{display:flex;gap:3px;height:5px}
.wd i u{width:5px;height:5px;border-radius:50%;background:var(--c)}

/* Profil */
.me-hero{text-align:center;padding:6px 0 0}
.me-hero .orb{width:104px;height:104px;font-size:52px;margin:0 auto 14px;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-5px)}}
.me-name{font-size:1.647rem;font-weight:700;letter-spacing:.013em;line-height:1.214}
.me-rank{font-size:1rem;color:var(--label-2);margin-top:2px}
.me-bar{max-width:320px;margin:16px auto 0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}
.tile{background:var(--card);border-radius:22px;padding:13px 16px}
.tile small{display:block;font-size:.765rem;color:var(--label-2);letter-spacing:-.006em}
.tile b{display:block;font-size:1.647rem;line-height:1.214;font-weight:700;margin-top:3px;letter-spacing:0}
.tile b span{font-size:.882rem;color:var(--label-2);font-weight:600}
.heat-wrap{padding:16px}
.heat-m{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:3px;font-size:11px;color:var(--label-2);margin-bottom:6px;font-weight:600;letter-spacing:0}
.heat{display:grid;grid-template-columns:repeat(var(--cols),1fr);grid-template-rows:repeat(7,auto);gap:3px}
.hc{aspect-ratio:1;border-radius:4px;border:0;padding:0;background:var(--fill)}
.hc.out{visibility:hidden}
.hc.fut{background:transparent;box-shadow:inset 0 0 0 1px var(--fill)}
.hc.l1{background:color-mix(in srgb,var(--blue) 28%,transparent)}
.hc.l2{background:color-mix(in srgb,var(--blue) 55%,transparent)}
.hc.l3{background:var(--blue)}
.hc.l4{background:var(--yellow)}
.hc.tdy{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--accent)}
.legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:11px;color:var(--label-2);margin-top:10px;letter-spacing:0}
.legend .hc{width:11px;height:11px}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--fill);gap:2px}
.stack i{display:block;height:100%}
.leg-row{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px}
.leg-row div{display:flex;align-items:center;gap:7px;font-size:.882rem;letter-spacing:-.016em}
.leg-row div i{width:8px;height:8px;border-radius:50%;flex:none}
.leg-row div b{margin-left:auto;font-weight:600}
.rank-row.locked{opacity:.4}
.danger{color:var(--red)!important}

/* Sheets (Liquid Glass, schwebend) */
.sheet-wrap{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.24);opacity:0;transition:opacity .35s}
.sheet{position:relative;width:min(calc(100% - 16px),600px);margin-bottom:max(8px,env(safe-area-inset-bottom));max-height:calc(100% - 16px - env(safe-area-inset-top));border-radius:38px;display:flex;flex-direction:column;
  background:var(--sheet);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);
  box-shadow:0 20px 60px rgba(0,0,0,.25),inset 0 0 0 .5px var(--glass-rim);
  transform:translateY(calc(100% + 40px));transition:transform .5s cubic-bezier(.2,.95,.25,1)}
.sheet-wrap.open .backdrop{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet.drag{transition:none}
.grab{width:36px;height:5px;border-radius:3px;background:var(--label-3);margin:6px auto 0;flex:none}
.sh-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:4px 12px 8px;gap:8px;flex:none;touch-action:none}
.sh-head h3{text-align:center;margin:0;font-size:17px;font-weight:600;letter-spacing:-.43px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-body{overflow-y:auto;padding:4px 16px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-body .list,.sh-body .card,.sh-body .btn-danger{background:var(--card-sheet)}
.inp{flex:1;border:0;background:none;font:inherit;font-size:1rem;color:var(--label);outline:none;min-width:0;padding:4px 0;letter-spacing:-.024em}
.inp::placeholder{color:var(--label-3)}
textarea.inp{resize:none;min-height:96px;line-height:1.35}
.sel{cursor:pointer}
.sel select{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px;-webkit-appearance:none;appearance:none}
.sel-v{display:flex;align-items:center;gap:4px;color:var(--label-2);margin-left:auto;max-width:62%;text-align:right}
.sel-v span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-v .i{width:14px;height:14px;stroke-width:2.4}
input.pick{-webkit-appearance:none;appearance:none;border:0;background:var(--fill);color:var(--label);font:inherit;font-size:1rem;padding:6px 11px;border-radius:8px;min-height:34px;margin-left:auto;text-align:center;letter-spacing:-.024em;font-variant-numeric:tabular-nums}
input[type=number].pick{width:84px}
input[type=date].pick::-webkit-date-and-time-value{text-align:center}
.sw-t{-webkit-appearance:none;appearance:none;width:62px;height:28px;border-radius:14px;background:var(--fill-2);position:relative;transition:background .25s;flex:none;margin:0 0 0 auto;cursor:pointer}
.sw-t::after{content:"";position:absolute;top:2px;left:2px;width:37px;height:24px;border-radius:12px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 2px rgba(0,0,0,.1);transition:transform .3s cubic-bezier(.3,1.3,.4,1)}
.sw-t:checked{background:var(--green)}
.sw-t:checked::after{transform:translateX(21px)}
.btn-danger,.btn-plain,.btn-primary{display:block;width:100%;border:0;border-radius:999px;font-size:1rem;font-weight:600;padding:15px;margin-top:22px;text-align:center;transition:transform .2s}
.btn-danger{background:var(--card);color:var(--red)}
.btn-primary{background:var(--accent);color:#fff}
.btn-plain{background:var(--fill);color:var(--label)}
.btn-link{display:block;margin:14px auto 0;border:0;background:none;color:var(--accent);font-size:1rem;padding:8px}
.btn-primary:active,.btn-plain:active,.btn-danger:active{transform:scale(.98);opacity:.85}
.rt-sum{padding:2px 4px 14px}
.rt-sum .metric-h{font-size:.882rem}
.rule{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;font-size:.882rem;line-height:1.33;position:relative;letter-spacing:-.016em}
.rule + .rule::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.rule b{white-space:nowrap;font-weight:600}
.minus-btn{width:24px;height:24px;border-radius:50%;border:0;background:var(--red);color:#fff;display:grid;place-items:center;flex:none;padding:0}
.minus-btn .i{width:13px;height:13px;stroke-width:3}

/* Detailansicht (bleibt über der Tab-Leiste sichtbar) */
.push{position:fixed;inset:0;z-index:42;background:var(--bg);transform:translateX(100%);transition:transform .45s cubic-bezier(.2,.9,.25,1);box-shadow:-10px 0 40px rgba(0,0,0,.16)}
.push.open{transform:none}
.push.drag{transition:none}
.push.away{visibility:hidden}
.push-scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.push-inner{position:relative;max-width:640px;margin:0 auto;padding:calc(56px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom))}
.push-bar{position:absolute;top:0;left:0;right:0;z-index:2;height:calc(52px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center}
.topic{--sl:16px;align-items:flex-start}
.topic .rc{padding-top:3px}
.tg{display:flex;gap:6px;flex:none}
.tg button{border:0;font-size:.765rem;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--fill);color:var(--label);letter-spacing:-.006em;transition:background .2s,color .2s}
.tg button.on{background:var(--c);color:#fff}

.toast{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translate(-50%,-140%);z-index:250;display:flex;align-items:center;gap:9px;border-radius:999px;padding:9px 18px 9px 10px;font-size:15px;font-weight:600;letter-spacing:-.23px;transition:transform .5s cubic-bezier(.3,1.35,.5,1);white-space:nowrap;pointer-events:none;max-width:calc(100% - 32px)}
.toast span{overflow:hidden;text-overflow:ellipsis}
.toast.in{transform:translate(-50%,0)}
.toast .ico{width:26px;height:26px;border-radius:50%}
.toast .ico .gl{width:15px;height:15px;stroke-width:2.6}
.toast.bump{animation:bump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:translate(-50%,0) scale(1.06)}}

.snow{position:fixed;inset:0;pointer-events:none;z-index:300;overflow:hidden}
.snow i{position:absolute;top:-30px;color:#8cc8ff;font-style:normal;text-shadow:0 0 10px rgba(150,205,255,.9);animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),112vh) rotate(260deg);opacity:.15}}

.lvl{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:24px;background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;transition:opacity .35s}
.lvl.in{opacity:1}
.lvl-card{width:min(100%,320px);border-radius:34px;padding:26px 22px 20px;text-align:center;transform:scale(.85);transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.lvl.in .lvl-card{transform:none}
.lvl-card .orb{width:100px;height:100px;font-size:50px;margin:0 auto 14px}
.lvl-k{font-size:.765rem;font-weight:700;letter-spacing:.12em;color:var(--accent)}
.lvl-n{font-size:2rem;font-weight:700;line-height:1.2;margin:2px 0 4px;letter-spacing:.011em}
.lvl-r{font-size:.882rem;color:var(--label-2)}

/* Willkommen */
.ob{min-height:calc(100vh - 170px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:10px 4px}
.app-ico{width:100px;height:100px;border-radius:23px;margin:0 auto 20px;display:block;box-shadow:0 10px 30px rgba(20,60,200,.25),0 0 0 .5px rgba(0,0,0,.06)}
.ob h1{font-size:2rem;line-height:1.206;font-weight:700;margin:0;letter-spacing:.011em}
.ob-dates{color:var(--label-2);font-size:.882rem;margin:6px 0 0}
.ob-claim{font-size:1.176rem;line-height:1.3;margin:16px 0 26px;font-weight:500;letter-spacing:-.023em}
.ob .list{text-align:left}
.step-n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:700;flex:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .snow{display:none}
}

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-3);
const pad = n => String(n).padStart(2,'0');
const ds = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const diffDays = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const T = () => ds(new Date());
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const fmtShort = s => { const d = pd(s); return `${WD[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth()+1)}.`; };
const fmtLong = s => { const d = pd(s); return `${WDL[d.getDay()]}, ${d.getDate()}. ${MON[d.getMonth()]}`; };
const fmtH = v => `${String(v).replace('.', ',')} h`;
const relDays = n => n === 0 ? 'heute' : n === 1 ? 'morgen' : n === -1 ? 'gestern' : n > 0 ? `in ${n} Tagen` : `vor ${-n} Tagen`;
const relDue = s => s === T() ? 'heute' : s === addDays(T(), 1) ? 'morgen' : fmtShort(s);
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
const C = c => `var(--${c})`;
const arcToday = () => { const t = T(); return t < START ? START : t > END ? END : t; };
const dayNum = s => diffDays(START, s) + 1;

/* ---------- Speicher ---------- */
const KEY = 'winterarc.v1';
let S = null;
function freshState(){
  return { v:1, name:'', created:T(), imported:false, seenLevel:1, haptics:true, habits:DEFAULT_HABITS.map(x => ({...x})),
    routines:{ morning:ROUTINES.morning.items.map(t => ({id:uid(), t})), evening:ROUTINES.evening.items.map(t => ({id:uid(), t})) },
    days:{}, blocks:[], todos:[], exams:[], goals:[] };
}
function normalize(s){
  const f = freshState();
  s = Object.assign(f, s || {});
  s.days = s.days && typeof s.days === 'object' ? s.days : {};
  for (const k of ['blocks','todos','exams','goals']) s[k] = Array.isArray(s[k]) ? s[k] : [];
  s.exams.forEach(x => { x.topics = Array.isArray(x.topics) ? x.topics : []; });
  if (!s.routines || !s.routines.morning || !s.routines.evening) s.routines = f.routines;
  if (typeof s.haptics !== 'boolean') s.haptics = true;
  if (!Array.isArray(s.habits) || !s.habits.length && !s.habitsEdited) s.habits = DEFAULT_HABITS.map(x => ({...x}));
  return s;
}
function load(){ try { const raw = localStorage.getItem(KEY); return raw ? normalize(JSON.parse(raw)) : null; } catch { return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('Speichern fehlgeschlagen', {g:'lock', c:'red'}); } }
const dayObj = d => (S.days[d] = S.days[d] || {});

/* ---------- Spielregeln ---------- */
const activeHabits = date => S.habits.filter(x => (!x.from || x.from <= date) && (!x.until || x.until > date));
function dayStats(date){
  const d = S.days[date] || {}, act = activeHabits(date), n = act.length;
  const h = act.filter(x => d.h && d.h[x.id]).length;
  const m = !!d.md, e = !!d.ed;
  const sleep = d.s == null ? null : d.s;
  const sl = sleep != null && sleep >= 7;
  const perfect = n > 0 && h === n && m && e;
  const xp = h*10 + (m?10:0) + (e?10:0) + (sl?10:0) + (perfect?25:0);
  return { h, n, m, e, sl, sleep, perfect, xp, max: n*10 + 55 };
}
function xpParts(){
  let days = 0;
  for (const k in S.days) days += dayStats(k).xp;
  const todos = S.todos.reduce((a, t) => a + (t.done ? PRIOS[t.prio].xp : 0), 0);
  const learn = S.exams.reduce((a, x) => a + x.topics.reduce((b, t) => b + (t.learned?15:0) + (t.reviewed?10:0), 0), 0);
  const goals = S.goals.filter(g => g.status === 'done').length * 100;

}
const levelFor = xp => Math.floor(Math.sqrt(xp / 50)) + 1;

const rankFor = L => RANKS.slice().reverse().find(r => L >= r.min);
function streak(test){

  while (d >= START && test(d)) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(test){
  if (T() < START) return 0;
  let best = 0, cur = 0;
  for (let d = START; d <= arcToday(); d = addDays(d, 1)) { if (test(d)) { cur++; if (cur > best) best = cur; } else cur = 0; }
  return best;
}
const habitDone = id => d => !!(S.days[d] && S.days[d].h && S.days[d].h[id]);
const perfectDone = d => dayStats(d).perfect;

  if (n === 1) return {t:'Morgen', c:'red'};
  if (n <= lead) return {t:'Lernphase', c:'orange'};
  return {t:'Noch Zeit', c:'gray'};
}

/* Offene Messanzeige (270°) – bewusst keine Ringe, die an Apples Aktivitätsringe erinnern */
function gauge(p, size=108, sw=10){

    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--fill-2)" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${arc} ${L}" transform="rotate(135 ${c} ${c})"/>

function dayStrip(){

    out += `<button class="ds ${d === ui.day ? 'sel' : ''} ${d === T() ? 'today' : ''} ${fut ? 'fut' : ''}" ${fut ? 'disabled' : `data-a="pick-day" data-d="${d}"`} aria-label="${fmtLong(d)}">
      <span class="ds-wd">${WD[dt.getDay()]}</span><b class="rnd">${dt.getDate()}</b>${ind}</button>`;

}

function streakRow(g, name, c, test){
  const cur = streak(test), best = bestStreak(test);
  return `<div class="li row">${ico(g, c)}<span class="rc"><span class="rt">${name}</span><span class="rs">Rekord: ${plural(best, 'Tag', 'Tage')}</span></span>
    <span class="rv rnd" style="color:var(--label);font-weight:600">${cur ? FLAME : ''}${cur}</span></div>`;
}
function heatmap(){
  const first = addDays(START, -((pd(START).getDay() + 6) % 7));
  const cols = Math.ceil((diffDays(first, END) + 1) / 7), t = T();
  let cells = '', months = '', lastM = -1;
  for (let c = 0; c < cols; c++) {
    const colStart = addDays(first, c * 7);
    for (let r = 0; r < 7; r++) {
      const d = addDays(colStart, r);
      if (d >= START && d <= END && pd(d).getMonth() !== lastM && pd(d).getDate() <= 7) { lastM = pd(d).getMonth(); months += `<span style="grid-column:${c + 1}">${MON[lastM].slice(0, 3)}</span>`; }
      let cls = 'hc', attr = '';
      if (d < START || d > END) cls += ' out';
      else if (d > t) cls += ' fut';
      else { const s = dayStats(d); cls += ' l' + (s.perfect ? 4 : s.xp === 0 ? 0 : s.xp / s.max < .34 ? 1 : s.xp / s.max < .67 ? 2 : 3); attr = `data-a="heat" data-d="${d}" aria-label="${fmtLong(d)}: ${s.xp} XP"`; if (d === t) cls += ' tdy'; }
      cells += `<button class="${cls}" ${attr} style="grid-column:${c + 1};grid-row:${r + 1}"></button>`;
    }
  }
  return `<div class="card heat-wrap" style="--cols:${cols}"><div class="heat-m">${months}</div><div class="heat">${cells}</div>
    <div class="legend">weniger <span class="hc l0"></span><span class="hc l1"></span><span class="hc l2"></span><span class="hc l3"></span> mehr · <span class="hc l4"></span> perfekt</div></div>`;
}

function renderTabs(){

/* ---------- Feedback: Haptik, Meldung, Schnee, Level-up ---------- */
function haptic(){
  if (S && S.haptics === false) return;
  try { const l = document.createElement('label'); l.ariaHidden = 'true'; l.style.display = 'none'; const i = document.createElement('input'); i.type = 'checkbox'; i.setAttribute('switch', ''); l.appendChild(i); document.head.appendChild(l); l.click(); l.remove(); } catch {}
  if (navigator.vibrate) try { navigator.vibrate(10); } catch {}
}
let toastEl = null, toastTimer = null;
function toast(msg, {g='check', c='green'}={}){
  const html = `<span class="ico" style="--c:${C(c)}">${G(g)}</span><span>${esc(msg)}</span>`;
  if (toastEl) { toastEl.innerHTML = html; toastEl.classList.remove('bump'); void toastEl.offsetWidth; toastEl.classList.add('bump'); clearTimeout(toastTimer); }
  else {
    const el = toastEl = document.createElement('div'); el.className = 'toast glass'; el.setAttribute('role', 'status'); el.innerHTML = html; document.body.appendChild(el);
    requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  }
  toastTimer = setTimeout(() => { const el = toastEl; toastEl = null; el.classList.remove('in', 'bump'); setTimeout(() => el.remove(), 450); }, 1900);
}
function snow(n=28){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'snow';
  for (let i = 0; i < n; i++) {
    const s = document.createElement('i'); s.textContent = '❄';
    s.style.left = Math.random()*100 + '%'; s.style.animationDelay = Math.random()*.7 + 's';
    s.style.animationDuration = 1.8 + Math.random()*1.6 + 's'; s.style.fontSize = 10 + Math.random()*16 + 'px';
    s.style.setProperty('--dx', (Math.random()*90 - 45) + 'px'); box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 4200);
}
function levelUp(L, newRank){
  const r = rankFor(L);
  const el = document.createElement('div'); el.className = 'lvl'; el.dataset.a = 'close-lvl'; el.setAttribute('role', 'alertdialog');
  el.innerHTML = `<div class="lvl-card glass"><div class="orb">${r.e}</div><div class="lvl-k">LEVEL UP</div><div class="lvl-n rnd">Level ${L}</div>
    <div class="lvl-r">${newRank ? `Neuer Rang: <b>${r.n}</b>` : `Weiter so, ${esc(S.name || 'Champion')}!`}</div>
    <button class="btn-primary" data-a="close-lvl">Weiter</button></div>`;
  document.body.appendChild(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  snow(40); haptic();
}

/* Jede Änderung läuft hierüber: speichern, neu zeichnen, XP-Gewinn melden */
function act(fn, opt={}){
  const before = xpParts().total, pb = dayStats(ui.day || arcToday()).perfect;
  fn(); save();
  const after = xpParts().total, pa = dayStats(ui.day || arcToday()).perfect;
  if (opt.key) ui.pop = opt.key;
  render();
  const g = after - before;
  if (pa && !pb) { toast(`Perfekter Tag · +${g} XP`, {g:'star', c:'yellow'}); snow(); }
  else if (g >= 100) { toast(`${opt.label || 'Ziel erreicht'} · +${g} XP`, {g:'target', c:'purple'}); snow(); }
  else if (g > 0) toast(`+${g} XP${opt.label ? ' · ' + opt.label : ''}`, {g:opt.g || 'check', c:opt.c || 'green'});
  if (opt.haptic !== false) haptic();
  const L = levelFor(after);
  if (L > (S.seenLevel || 1)) { const oldRank = rankFor(S.seenLevel || 1); S.seenLevel = L; save(); setTimeout(() => levelUp(L, rankFor(L) !== oldRank), 650); }
}

async function decryptSeed(pw){
  const raw = Uint8Array.from(atob(SEED), c => c.charCodeAt(0));
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw.trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:raw.slice(0, 16), iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw.slice(16, 28)}, key, raw.slice(28));
  return JSON.parse(new TextDecoder().decode(pt));
}
function applySeed(seed){
  if (!S.name && seed.name) S.name = seed.name;
  for (const [name, type, start, end, dates] of seed.rec) for (const date of dates) S.blocks.push({id:uid(), name, type, date, start, end, note:'', cal:true});
  for (const [name, type, date, start, end] of seed.one) S.blocks.push({id:uid(), name, type, date, start, end, note:'', cal:true});
  for (const [name, kind, date] of seed.exams) S.exams.push({id:uid(), name, kind, date, grade:'', topics:[]});
  for (const [name, area, type, status, deadline] of seed.goals) S.goals.push({id:uid(), name, area, type, status, deadline, why:''});
  S.imported = true;
}

let openSw = null;
function closeSwipe(instant){
  if (!openSw) return;
  const c = openSw.querySelector('.sw-c');
  if (instant) openSw.classList.add('moving');
  c.style.transform = ''; openSw.classList.remove('open', 'dir-r', 'dir-l');
  const r = openSw; openSw = null;
  if (instant) requestAnimationFrame(() => r.classList.remove('moving'));
}
function enableRowSwipe(){
  let row = null, x0 = 0, y0 = 0, dx = 0, mode = null, base = 0;
  document.addEventListener('touchstart', e => {
    const r = e.target.closest('.sw');
    if (openSw && openSw !== r) closeSwipe();
    row = r; mode = null; dx = 0; if (!r) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; base = r.classList.contains('open') ? -88 : 0;
  }, {passive:true});
  document.addEventListener('touchmove', e => {
    if (!row) return;
    const t = e.touches[0], mx = t.clientX - x0, my = t.clientY - y0;
    if (!mode) { if (Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my)) mode = 'h'; else if (Math.abs(my) > 8) { mode = 'v'; row = null; return; } else return; }
    e.preventDefault();
    const w = row.offsetWidth, lead = !!row.dataset.lead;
    dx = Math.max(-w, Math.min(lead ? w * .6 : 0, base + mx));
    row.classList.add('moving'); row.classList.toggle('dir-r', dx < 0); row.classList.toggle('dir-l', dx > 0);
    row.querySelector('.sw-c').style.transform = `translateX(${dx}px)`;
  }, {passive:false});
  document.addEventListener('touchend', () => {
    const r = row; row = null; if (!r || mode !== 'h') return;
    r.classList.remove('moving');
    const c = r.querySelector('.sw-c'), w = r.offsetWidth;
    if (dx < -w * .55) { c.style.transform = `translateX(${-w}px)`; haptic(); setTimeout(() => A[r.dataset.del]({dataset:{id:r.dataset.id}}), 180); }
    else if (dx < -44) { c.style.transform = 'translateX(-88px)'; r.classList.add('open'); openSw = r; }
    else if (dx > 72 && r.dataset.lead) { c.style.transform = ''; r.classList.remove('dir-l'); A[r.dataset.lead]({dataset:{id:r.dataset.id}}); }
    else { c.style.transform = ''; r.classList.remove('open', 'dir-r', 'dir-l'); }
  });
}

/* ---------- Aktionen ---------- */
const findExam = () => S.exams.find(e => e.id === ui.examId);
const A = {
  tab: el => { if (el.dataset.d) ui.planDay = el.dataset.d; switchTab(el.dataset.tab); },
  'pick-day': el => { ui.day = el.dataset.d; render(); },
  'go-today': () => { ui.day = arcToday(); render({stripToSel:true}); },
  heat: el => { ui.day = el.dataset.d; ui.scroll.today = 0; switchTab('today'); render({stripToSel:true}); },
  habit: el => {
    const id = el.dataset.h, hb = S.habits.find(x => x.id === id);
    act(() => { const d = dayObj(ui.day); d.h = d.h || {}; if (d.h[id]) delete d.h[id]; else d.h[id] = 1; }, {key:el.dataset.k, g:hb.g, c:hb.c, label:hb.name});
  },
  'manage-habits': () => { switchTab('me'); const s = $('#habits-sec'); if (s) scrollTo(0, s.getBoundingClientRect().top + scrollY - 70); },
  'new-habit': () => openHabit(),
  'edit-habit': el => openHabit(el.dataset.id),
  'save-habit': () => {
    const name = fv('title').trim(); if (!name) { toast('Gib dem Habit einen Namen', {g:'note', c:'orange'}); return; }
    const id = $('#f').dataset.id, g = fv('g') || 'star', c = fv('c') || 'blue';
    act(() => { S.habitsEdited = true; if (id) Object.assign(S.habits.find(x => x.id === id), {name, g, c}); else S.habits.push({id:uid(), name, g, c, from:arcToday()}); }, {haptic:false});
    closeSheet();
  },
  'del-habit': el => {
    if (!confirm('Habit löschen? Die bisher gesammelten XP bleiben erhalten.')) return;
    act(() => {
      S.habitsEdited = true;
      const hb = S.habits.find(x => x.id === el.dataset.id), today = arcToday();
      // Ohne Vergangenheit ganz entfernen, sonst ab heute ausblenden
      if (!hb.from || hb.from >= today) S.habits = S.habits.filter(x => x !== hb); else hb.until = today;
    }, {haptic:false});
    closeSheet();
  },
  routine: el => openRoutine(el.dataset.r),
  'rt-item': el => {
    const k = el.dataset.r, r = ROUTINES[k], id = el.dataset.id;
    act(() => {
      const d = dayObj(ui.day), map = d[r.key] = d[r.key] || {};
      if (map[id]) delete map[id]; else map[id] = 1;
      const items = S.routines[k]; d[r.done] = items.length > 0 && items.every(it => map[it.id]);
      if (!d[r.done]) delete d[r.done];
    }, {key:`ri-${id}`, g:r.g, c:r.c, label:`${r.name} komplett`});
  },
  sleep: el => act(() => { const d = dayObj(ui.day), dv = +el.dataset.v; d.s = d.s == null ? (dv > 0 ? 7 : 6.5) : Math.max(0, Math.min(14, d.s + dv)); }, {g:'zzz', c:'teal', label:'Ausgeschlafen'}),
  note: () => openNote(),
  'save-note': () => { const v = fv('note').trim(); act(() => { const d = dayObj(ui.day); if (v) d.n = v; else delete d.n; }, {haptic:false}); closeSheet(); },
  todo: el => act(() => { const t = S.todos.find(x => x.id === el.dataset.id); t.done = !t.done; t.doneAt = t.done ? T() : null; }, {key:`t-${el.dataset.id}`, label:'To-do erledigt'}),
  'new-todo': el => openTodo(null, el && el.dataset && el.dataset.d ? {due:el.dataset.d} : {}),
  'edit-todo': el => openTodo(el.dataset.id),
  'save-todo': saveTodo,
  'del-todo': el => { if (!confirm('To-do löschen?')) return; act(() => { S.todos = S.todos.filter(x => x.id !== el.dataset.id); }, {haptic:false}); closeSheet(); },
  'del-todo-now': el => { act(() => { S.todos = S.todos.filter(x => x.id !== el.dataset.id); }, {haptic:false}); },
  'toggle-done': () => { ui.showDone = !ui.showDone; render(); },
  seg: el => { ui.seg = el.dataset.v; const s = el.closest('.seg'); s.style.setProperty('--i', [...s.querySelectorAll('button')].indexOf(el)); s.querySelectorAll('button').forEach(b => b.setAttribute('aria-selected', b === el)); $('#segc').innerHTML = segContent(); renderTop(); },
  'new-goal': () => openGoal(),
  'edit-goal': el => openGoal(el.dataset.id),
  'save-goal': saveGoal,
  'del-goal': el => { if (!confirm('Ziel löschen?')) return; act(() => { S.goals = S.goals.filter(x => x.id !== el.dataset.id); S.todos.forEach(t => { if (t.goalId === el.dataset.id) t.goalId = ''; }); }, {haptic:false}); closeSheet(); },
  'goal-status': el => act(() => { S.goals.find(x => x.id === el.dataset.id).status = el.dataset.v; }, {label:'Ziel erreicht'}),
  'new-block': el => openBlock(null, el && el.dataset && el.dataset.d ? el.dataset.d : (ui.tab === 'plan' ? ui.planDay : ui.day)),
  'edit-block': el => openBlock(el.dataset.id),
  'save-block': saveBlock,
  'del-block': el => { if (!confirm('Zeitblock löschen?')) return; act(() => { S.blocks = S.blocks.filter(x => x.id !== el.dataset.id); }, {haptic:false}); closeSheet(); },
  'del-block-now': el => { act(() => { S.blocks = S.blocks.filter(x => x.id !== el.dataset.id); }, {haptic:false}); },
  week: el => { ui.planDay = addDays(ui.planDay, 7 * +el.dataset.v); render(); },
  'plan-day': el => { ui.planDay = el.dataset.d; render(); },
  'plan-today': () => { ui.planDay = T(); render(); },
  'new-exam': () => openExam(),
  'edit-exam': () => openExam(ui.examId),
  'save-exam': saveExam,
  'del-exam': el => { if (!confirm('Prüfung samt Themen löschen?')) return; act(() => { S.exams = S.exams.filter(x => x.id !== el.dataset.id); }, {haptic:false}); closeSheet(); if (push) closePush(); },
  'open-exam': el => { if (ui.tab !== 'learn') switchTab('learn'); openPush(el.dataset.id); },
  'close-push': () => closePush(),
  topic: el => {
    const f = el.dataset.f, id = el.dataset.id;
    act(() => { const tp = findExam().topics.find(t => t.id === id); tp[f] = !tp[f]; }, {key:`tp-${id}`, g:f === 'learned' ? 'book' : 'check', c:f === 'learned' ? 'orange' : 'purple', label:f === 'learned' ? 'Thema gelernt' : 'Thema wiederholt'});
  },
  'add-topic': () => {
    const inp = $('#newTopic'), name = inp ? inp.value.trim() : '';
    if (!name) { if (inp) inp.focus(); return; }
    inp.value = '';
    act(() => { findExam().topics.push({id:uid(), name, learned:false, reviewed:false, on:null}); }, {haptic:false});
    const ni = $('#newTopic'); if (ni) ni.focus({preventScroll:true});
  },
  'edit-topic': el => openTopic(el.dataset.id),
  'save-topic': () => {
    const name = fv('title').trim(); if (!name) { toast('Gib dem Thema einen Namen', {g:'note', c:'orange'}); return; }
    const id = $('#f').dataset.id, on = fc('has_on') ? fv('on') : null;
    act(() => { const tp = findExam().topics.find(t => t.id === id); tp.name = name; tp.on = on; }, {haptic:false}); closeSheet();
  },
  'del-topic': el => { act(() => { const x = findExam(); x.topics = x.topics.filter(t => t.id !== el.dataset.id); }, {haptic:false}); closeSheet(); },
  'del-topic-now': el => { act(() => { const x = findExam(); x.topics = x.topics.filter(t => t.id !== el.dataset.id); }, {haptic:false}); },
  'edit-name': () => openName(),
  'save-name': () => { const v = fv('title').trim(); act(() => { S.name = v; }, {haptic:false}); closeSheet(); },
  'edit-routines': () => openRoutineEditor(),
  'rt-add': el => { const tmp = document.createElement('div'); tmp.innerHTML = rtEditRow('new-' + uid(), ''); const row = tmp.firstElementChild; el.before(row); row.querySelector('.inp').focus(); },
  'rt-del': el => el.closest('.row').remove(),
  'save-routines': () => {
    const next = {};
    for (const k of ['morning', 'evening']) next[k] = [...document.querySelectorAll(`[data-rt="${k}"] .row[data-id]`)].map(r => ({ id: r.dataset.id.startsWith('new-') ? uid() : r.dataset.id, t: r.querySelector('.inp').value.trim() })).filter(it => it.t);
    act(() => { S.routines = next; }, {haptic:false}); closeSheet(); toast('Routinen gespeichert', {g:'list', c:'orange'});
  },
  'toggle-haptics': el => { S.haptics = el.checked; save(); if (S.haptics) haptic(); },
  rules: () => openRules(),
  notion: () => {
    if (S && S.imported && !confirm('Die Notion-Daten wurden schon übernommen. Nochmal laden? Das erzeugt doppelte Einträge.')) return;
    openNotion();
  },
  'notion-go': async el => {
    const pw = fv('pw'); if (!pw.trim()) return;
    el.textContent = 'Wird entschlüsselt …'; el.disabled = true;
    try {
      const seed = await decryptSeed(pw), first = !S;
      if (first) S = freshState();
      applySeed(seed); save(); closeSheet(); ui.day = null; render({enter:true});
      toast(first ? `Willkommen, ${S.name || 'Champion'}` : 'Notion-Daten übernommen', {g:'snow', c:'cyan'}); snow(); haptic();
    } catch { el.textContent = 'Daten laden'; el.disabled = false; toast('Falsches Passwort', {g:'lock', c:'red'}); }
  },
  'ob-fresh': () => { S = freshState(); save(); render({enter:true}); },
  'ob-browser': () => { ui.obBrowser = true; render(); },
  export: () => exportData(),
  import: () => openImport(),
  'import-text': () => restore(fv('code')),
  reset: () => {
    if (!confirm('Wirklich alles löschen? Habits, XP, Termine und To-dos sind dann weg.')) return;
    if (!confirm('Letzte Warnung: Hast du ein Backup? Alles wird gelöscht.')) return;
    localStorage.removeItem(KEY); S = null; ui.day = null; ui.tab = 'today'; if (push) { push.remove(); push = null; } render();
  },
  'close-sheet': () => closeSheet(),
  'close-lvl': (el, e) => { const l = e.target.closest('.lvl'); if (!l) return; l.classList.remove('in'); setTimeout(() => l.remove(), 350); },
};
document.addEventListener('click', e => {
  // Offene Wischzeile zuerst schließen, statt den Tipp auszuführen
  if (openSw) { const inside = e.target.closest('.sw'); if (!(inside === openSw && e.target.closest('.sw-bg'))) { closeSwipe(); e.preventDefault(); return; } }
  const el = e.target.closest('[data-a]'); if (!el) return;
  const fn = A[el.dataset.a]; if (!fn) return;
  if (el.tagName === 'BUTTON' || el.dataset.a === 'close-lvl' || el.classList.contains('backdrop')) e.preventDefault();
  fn(el, e);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !sheetEl || e.target.tagName === 'TEXTAREA') return;
  if (e.target.name === 'pw') { e.preventDefault(); const b = sheetEl.querySelector('[data-a="notion-go"]'); if (b) b.click(); return; }
  const ok = sheetEl.querySelector('.sh-head .tint'); if (ok && e.target.classList.contains('inp')) { e.preventDefault(); ok.click(); }
});

/* Tastatur: Sheets bleiben über der Tastatur */
if (window.visualViewport) {
  const vv = () => { document.documentElement.style.setProperty('--vvh', visualViewport.height + 'px'); document.documentElement.style.setProperty('--vvt', visualViewport.offsetTop + 'px'); };
  visualViewport.addEventListener('resize', vv); visualViewport.addEventListener('scroll', vv); vv();
}
/* Beim Zurückkehren in die App auf den neuen Tag springen */
let lastSeen = T();
document.addEventListener('visibilitychange', () => { if (!document.hidden && S && T() !== lastSeen) { lastSeen = T(); ui.day = arcToday(); render({stripToSel:true}); } });

if (isStandalone()) document.documentElement.classList.add('standalone');
S = load();
enableWeekSwipe();
enableRowSwipe();
render({stripToSel:true});
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
/* Updates: beim Öffnen und bei jeder Rückkehr in die App nach einer neuen Version fragen.
   Kommt eine, lädt die App sich neu, sobald kein Sheet offen ist. */
let reloadPending = false;
function reloadIfIdle(){ if (reloadPending && !sheetEl) location.reload(); }
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController) return; reloadPending = true; reloadIfIdle(); });
}
</script>
